    setTimeout(() => {
      loadingMask.style.display = "none";
    }, 500);
  }, 1000);
  updateInputCountTip();
};
function copyTextToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast();
    }).catch(err => {
      alert("卦辞誊抄失败，请手动誊抄～");
    });
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast();
  }
}
function showToast() {
  copyToast.classList.add("show");
  setTimeout(() => {
    copyToast.classList.remove("show");
  }, 3000);
}
function updateInputCountTip() {
  const len = numInput.value.length;
  const remain = 3 - len;
  if (remain === 3) {
    inputCountTip.innerText = "还需3位数字";
  } else if (remain > 0) {
    inputCountTip.innerText = `还需${remain}位数字`;
  } else {
    inputCountTip.innerText = "位数已够，可开始占卦";
  }
}
function btnShakeEffect(btn) {
  btn.style.animation = "btnShake 0.5s ease";
  setTimeout(() => {
    btn.style.animation = "";
  }, 500);
}
function throwOnce() {
  while (true) {
    let cnt = 0;
    for (let i=0; i<4; i++) if (Math.random() > 0.5) cnt++;
    if (cnt >=1 && cnt <=4) return cnt;
  }
}
function randomGua() {
  let a = throwOnce();
  let b = throwOnce();
  let c = throwOnce();
  return ""+a+b+c;
}
function showResult(key) {
  if (!GUA[key]) {
    alert("请输入1-4组成的三位卦数，如324");
    stopJumpNumbers();
    shakeAnimate.style.display = "none";
    return;
  }
  let [name, cn] = GUA[key];
  let cnNum = numMap[key[0]] + numMap[key[1]] + numMap[key[2]];
  guaTitle.innerText = `【${cnNum}】${name}`;
  cnText.innerText = cn;
  stopJumpNumbers();
  shakeAnimate.style.display = "none";
  result.style.display = "block";
}
function resetAll() {
  numInput.value = "";
  result.style.display = "none";
  stopJumpNumbers();
  shakeAnimate.style.display = "none";
  updateInputCountTip();
  numInput.focus();
}
function startJumpNumbers() {
  stopJumpNumbers();
  jumpInterval = setInterval(() => {
    const n1 = Math.floor(Math.random()*4)+1;
    const n2 = Math.floor(Math.random()*4)+1;
    const n3 = Math.floor(Math.random()*4)+1;
    num1.innerText = numToChinese[n1];
    num2.innerText = numToChinese[n2];
    num3.innerText = numToChinese[n3];
  }, 300);
}
function stopJumpNumbers() {
  if (jumpInterval) {
    clearInterval(jumpInterval);
    jumpInterval = null;
  }
}
function startShake(cb) {
  shakeAnimate.style.display = "block";
  startJumpNumbers();
  result.style.display = "none";
  setTimeout(() => {
    cb();
  }, SHAKE_DELAY);
}
document.getElementById("randomBtn").onclick = function() {
  btnShakeEffect(this);
  inputWrap.style.display = "none";
  startShake(() => showResult(randomGua()));
};
document.getElementById("manualBtn").onclick = function() {
  btnShakeEffect(this);
  inputWrap.style.display = "flex";
  resetAll();
  numInput.select();
};
document.getElementById("searchBtn").onclick = function() {
  btnShakeEffect(this);
  let val = numInput.value.trim().replace(/\s/g, "");
  if(val.length!==3) return alert("请输入3位1-4的数字");
  startShake(() => showResult(val));
};
document.getElementById("resetBtn").onclick = function() {
  btnShakeEffect(this);
  resetAll();
};
numInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("searchBtn").click();
});
numInput.addEventListener("input", () => {
  numInput.value = numInput.value.replace(/[^1-4]/g, "").slice(0, 3);
  updateInputCountTip();
});
cnText.addEventListener("click", () => {
  copyTextToClipboard(cnText.innerText);
});
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  alert("心诚则灵，请勿搬运代码～");
});
document.body.style.backgroundImage = "url('https://img.ixiaocai.cn/uploads/2024/09/12/66e2279089998.jpg')";
document.body.addEventListener('error', function(e) {
  if (e.target.tagName === 'IMG' || e.target.style.backgroundImage) {
    document.body.style.backgroundImage = "none";
  }
}, true);
</script>
</body>
